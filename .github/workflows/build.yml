name: Auto build and pre-release

on:
  pull_request:
    branches: [ "stable" ]
  workflow_dispatch:
  push:
    branches: [ "stable" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:

  # =========================================================
  # 🔎 Detect changed files (Android vs C++)
  # =========================================================
  detect:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      apk_changed: ${{ steps.filter.outputs.apk }}
      plugins_changed: ${{ steps.filter.outputs.plugins}}
    steps:
      - uses: actions/checkout@v4

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Android related changes
            apk:
              - 'app/**'
              - '**/*.gradle'
              - 'gradle/**'
              - 'CasioEmuMsvc/**'

            # C++ / plugin related changes
            plugins:
              - 'ExamplePlugin/**'


  # =========================================================
  # 🏗 Build job
  # =========================================================
  build:
    needs: detect
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            name: "Android"
          # Windows & Linux vẫn giữ nguyên (không xoá)
          # nếu sau này thêm lại thì vẫn chạy bình thường
    
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7
      with:
        fetch-depth: 1
        submodules: true

    # ================= WINDOWS (giữ nguyên, hiện không dùng) =================
    - name: Add MSBuild to PATH
      if: matrix.platform == 'windows'
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      if: matrix.platform == 'windows'
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build Solution (${{ matrix.platform_arch }})
      if: matrix.platform == 'windows'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{ matrix.platform_arch }} ${{env.SOLUTION_FILE_PATH}}

    # ================= ANDROID =================
    - name: Set up JDK 21
      if: matrix.platform == 'android' && needs.detect.outputs.apk_changed == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission to gradlew
      if: matrix.platform == 'android' && needs.detect.outputs.apk_changed == 'true'
      run: chmod +x gradlew

    - name: Build with Gradle
      if: matrix.platform == 'android' && needs.detect.outputs.apk_changed == 'true'
      run: ./gradlew assembleRelease

    - name: Upload APK
      if: matrix.platform == 'android' && needs.detect.outputs.apk_changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        compression-level: 0

    # ================= LINUX (giữ nguyên, không xoá) =================
    - name: Grant execute permission to build script
      if: matrix.platform == 'linux'
      run: chmod +x build-linux.sh

    - name: Build for Linux
      if: matrix.platform == 'linux'
      run: sudo DEBIAN_FRONTEND=noninteractive ./build-linux.sh -y

    - name: Upload Linux Build Artifact
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: Release-Linux-x64
        path: build/CasioEmuMsvc/CasioEmuMsvc
        if-no-files-found: error
    
  plugin-build:
    name: Build Plugin
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.plugins_changed == 'true'
  
    steps:
      - uses: actions/checkout@v4
  
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
  
      - name: Compile Plugin
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
          -std=c++17 \
          -shared \
          -fPIC \
          -O2 \
          -IExamplePlugin \
          -IExamplePlugin/imgui \
          ExamplePlugin/PluginCIInput.cpp \
          -o ExamplePlugin/PluginCIOutput.so
      
      - name: Release Plugin Output
        uses: actions/upload-artifact@v4
        with:
          name: PluginOutput
          path: ExamplePlugin/PluginCIOutput.so
          if-no-files-found: error

  # =========================================================
  # 🚀 Release job
  # =========================================================
  release:
    name: Create Release
    needs: [detect, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' &&
    github.ref == 'refs/heads/stable' &&
    (needs.detect.outputs.apk_changed == 'true' ||
     needs.detect.outputs.plugins_changed == 'true')

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7
      with:
        fetch-depth: 0

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Generate Release Details
      id: release_details
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        echo "COMMIT_HASH=$SHORT_HASH" >> $GITHUB_ENV
        echo "RELEASE_TAG=stable-$(date +'%Y%m%d%H%M%S')-$SHORT_HASH" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        
        CHANGELOG_CONTENT=$(git log -5 --pretty=format:"- %s (%h)" --abbrev-commit)
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        
        # Copy Android APK if exists
        if [ -f "./artifacts/app-release/app-release.apk" ]; then
          cp "./artifacts/app-release/app-release.apk" "release_assets/app-android-${{ env.COMMIT_HASH }}.apk"
        fi
        
        # Copy Plugin if exists
        if [ -f "./artifacts/PluginOutput/PluginCIOutput.so" ]; then
          cp "./artifacts/PluginOutput/PluginCIOutput.so" \
             "release_assets/plugin-${{ env.COMMIT_HASH }}.so"
        fi
        
        ls -la release_assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.2.2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: '🚧 Auto Build ${{ env.RELEASE_TAG }} (Pre-release)'
        body: |
          ## ⚠️ Pre-release Auto Build
          **Build Date:** ${{ env.RELEASE_DATE }}
          **Commit:** ${{ env.COMMIT_HASH }}

          ### Recent Changes
          ${{ env.CHANGELOG }}
        files: release_assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}